# Decap CMS — La guIA
# Docs: https://decapcms.org/docs/github-backend/

backend:
  name: github
  repo: LuisMonasterios/laguia
  branch: main
  base_url: https://www.laguia.tech/api
  auth_endpoint: auth

media_folder: public/images/uploads
public_folder: /images/uploads

locale: es

collections:
  - name: articulos
    label: Artículos
    label_singular: Artículo
    folder: src/content/articulos
    create: true
    extension: mdx
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción SEO, name: description, widget: text }
      - { label: Fecha publicación, name: pubDate, widget: datetime }
      - { label: Fecha actualización, name: updatedDate, widget: datetime, required: false }
      - label: Categoría
        name: category
        widget: select
        options:
          - productividad
          - profesiones
          - creatividad
      - { label: Tags (SEO), name: tags, widget: list, default: [] }
      - { label: Borrador, name: draft, widget: boolean, default: false }
      - { label: Destacado, name: featured, widget: boolean, default: false }
      - { label: Minutos lectura, name: readingTime, widget: number, default: 10 }
      - { label: Imagen URL, name: image, widget: string }
      - { label: Alt imagen, name: imageAlt, widget: string }
      - { label: Aviso afiliados, name: affiliateDisclosure, widget: boolean, default: true }
      - { label: Contenido (Markdown/MDX), name: body, widget: markdown }
